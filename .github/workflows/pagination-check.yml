name: Pagination Checks

on:
  push:
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "hack/check-pagination*"
      - "hack/check-emias-pagination*"
      - "hack/check-image-detail*"
      - "docs/zh-CN/PAGINATION.md"
      - "docs/zh-CN/PAGINATION_ACCEPTANCE_2026-09-02.md"
      - ".github/workflows/pagination-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/src/**"
      - "hack/check-pagination*"
      - "hack/check-emias-pagination*"
      - "hack/check-image-detail*"
      - "docs/zh-CN/PAGINATION.md"
      - "docs/zh-CN/PAGINATION_ACCEPTANCE_2026-09-02.md"
      - ".github/workflows/pagination-check.yml"

permissions:
  contents: read

jobs:
  pagination-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "backend/go.mod"
          cache-dependency-path: backend/go.sum

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Swagger pagination paths and frontend guards
        working-directory: .
        run: node hack/check-pagination-static.mjs

      - name: Run offline pagination acceptance test
        working-directory: .
        run: node --test hack/check-pagination.test.mjs hack/check-emias-pagination.test.mjs hack/check-image-detail.test.mjs

      - name: Run full backend test suite
        working-directory: backend
        env:
          GIN_MODE: debug
          CRATER_DEBUG_CONFIG_PATH: ${{ github.workspace }}/backend/etc/example-config.yaml
          CRATER_SKIP_OPERATION_LOG_MIGRATION: "1"
        run: go test ./... -count=1

      - name: Run frontend pagination regression tests
        run: pnpm test:pagination

      - name: Type-check frontend
        run: pnpm exec tsc --noEmit

      - name: Build frontend
        run: pnpm build
